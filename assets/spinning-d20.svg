<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .spin-die {
        animation: rotateD20 6s infinite linear;
        transform-origin: 50px 50px;
      }
      .shimmer {
        animation: pulseShimmer 2s infinite alternate ease-in-out;
      }
      @keyframes rotateD20 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseShimmer {
        0% { filter: drop-shadow(0 0 2px #00ffff); }
        100% { filter: drop-shadow(0 0 10px #ff00ff); }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="44" fill="#11052c" stroke="#441177" stroke-width="2"/>

  <!-- Rotating D20 Body -->
  <g class="spin-die shimmer">
    <!-- Outer Hexagon shape -->
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#1b1238" stroke="#00ffff" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Triangles -->
    <!-- Center top triangle -->
    <polygon points="50,28 72,64 28,64" fill="#321b6d" stroke="#ff00ff" stroke-width="1.8"/>
    <!-- Center number 20 -->
    <text x="50" y="56" font-family="'Impact', 'Arial Black', sans-serif" font-weight="bold" font-size="20" fill="#ffff00" text-anchor="middle" letter-spacing="1">20</text>
    
    <!-- Top vertex to center points -->
    <line x1="50" y1="6" x2="50" y2="28" stroke="#00ffff" stroke-width="2"/>
    <line x1="50" y1="6" x2="28" y2="64" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="50" y1="6" x2="72" y2="64" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Corners to center triangle -->
    <line x1="12" y1="28" x2="50" y2="28" stroke="#ff00ff" stroke-width="2"/>
    <line x1="12" y1="28" x2="28" y2="64" stroke="#00ffff" stroke-width="2"/>
    
    <line x1="88" y1="28" x2="50" y2="28" stroke="#ff00ff" stroke-width="2"/>
    <line x1="88" y1="28" x2="72" y2="64" stroke="#00ffff" stroke-width="2"/>
    
    <line x1="12" y1="72" x2="28" y2="64" stroke="#ff00ff" stroke-width="2"/>
    <line x1="12" y1="72" x2="50" y2="94" stroke="#00ffff" stroke-width="2"/>
    
    <line x1="88" y1="72" x2="72" y2="64" stroke="#ff00ff" stroke-width="2"/>
    <line x1="88" y1="72" x2="50" y2="94" stroke="#00ffff" stroke-width="2"/>
    
    <line x1="28" y1="64" x2="50" y2="94" stroke="#00ffff" stroke-width="2"/>
    <line x1="72" y1="64" x2="50" y2="94" stroke="#00ffff" stroke-width="2"/>

    <!-- Sparkles on vertices -->
    <circle cx="50" cy="6" r="3" fill="#ffffff"/>
    <circle cx="88" cy="28" r="3" fill="#ffffff"/>
    <circle cx="88" cy="72" r="3" fill="#ffffff"/>
    <circle cx="50" cy="94" r="3" fill="#ffffff"/>
    <circle cx="12" cy="72" r="3" fill="#ffffff"/>
    <circle cx="12" cy="28" r="3" fill="#ffffff"/>
  </g>
</svg>