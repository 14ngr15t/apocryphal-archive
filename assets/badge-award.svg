<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805a00"/>
    </linearGradient>
    <style>
      .award-sparkle { animation: awardSparkle 1.5s infinite alternate; }
      @keyframes awardSparkle {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>
  <!-- Gold Shield -->
  <rect x="2" y="2" width="116" height="36" fill="#110022" stroke="url(#goldGrad)" stroke-width="2" rx="3"/>
  <rect x="4" y="4" width="112" height="32" fill="#2d0a4e"/>
  
  <!-- Ribbon / Star -->
  <polygon points="16,8 19,16 27,16 21,21 23,29 16,24 9,29 11,21 5,16 13,16" fill="url(#goldGrad)" stroke="#553300" stroke-width="0.5"/>
  <circle cx="16" cy="18" r="2.5" fill="#ffffff" class="award-sparkle"/>

  <text x="32" y="14" font-family="'Impact', Arial, sans-serif" font-size="9" fill="#ffff55" letter-spacing="0.5">CYBERSURF '97</text>
  <text x="32" y="24" font-family="'Times New Roman', serif" font-weight="bold" font-size="8" fill="#ffffff">GOLD HOMEPAGE</text>
  <text x="32" y="32" font-family="'Courier New', monospace" font-size="7" fill="#00ffff">AWARD WINNER</text>
</svg>