<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 31" width="88" height="31">
  <defs>
    <linearGradient id="nsGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="100%" stop-color="#005588"/>
    </linearGradient>
  </defs>
  <!-- Beveled 90s border -->
  <rect x="0" y="0" width="88" height="31" fill="#000" stroke="#fff" stroke-width="1"/>
  <rect x="1" y="1" width="86" height="29" fill="url(#nsGrad)"/>
  
  <!-- Netscape Ship Wheel / N Icon -->
  <rect x="3" y="4" width="22" height="23" fill="#000" stroke="#00cccc" stroke-width="1"/>
  <text x="14" y="21" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#00ffcc" text-anchor="middle">N</text>
  
  <!-- Text -->
  <text x="29" y="13" font-family="'Arial Black', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">NETSCAPE</text>
  <rect x="28" y="15" width="56" height="12" fill="#0099cc"/>
  <text x="56" y="24" font-family="'Impact', Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffff00" text-anchor="middle">NOW 3.0</text>
</svg>