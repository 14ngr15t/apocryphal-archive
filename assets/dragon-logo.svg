<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <style>
      .wing { animation: flapWing 0.6s infinite alternate ease-in-out; transform-origin: 50px 40px; }
      .fire-breath { animation: breatheFire 0.8s infinite alternate ease-in-out; }
      @keyframes flapWing {
        0% { transform: rotate(-8deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes breatheFire {
        0% { opacity: 0.2; transform: scaleX(0.7); }
        100% { opacity: 1; transform: scaleX(1.3); }
      }
    </style>
  </defs>
  <!-- Dragon Wing Back -->
  <path class="wing" d="M48 35 C35 15 15 20 5 35 C15 40 25 38 35 45 Z" fill="#881111" stroke="#440000" stroke-width="1.5"/>
  <!-- Dragon Body -->
  <path d="M40 55 C35 65 42 75 52 72 C62 70 65 58 60 48 C55 40 45 42 40 55 Z" fill="#b31b1b" stroke="#300" stroke-width="1.5"/>
  <!-- Dragon Neck & Head -->
  <path d="M56 46 C62 42 70 38 78 40 C85 41 90 35 86 30 C80 28 72 32 64 36 C58 40 55 43 56 46 Z" fill="#cc2222" stroke="#300" stroke-width="1.5"/>
  <!-- Horns -->
  <path d="M80 30 C82 22 86 16 92 14 C87 22 85 26 82 29 Z" fill="#e6c687" stroke="#222" stroke-width="1"/>
  <!-- Dragon Eye -->
  <circle cx="83" cy="33" r="1.8" fill="#ffff00"/>
  <circle cx="83.5" cy="33" r="0.8" fill="#000000"/>
  <!-- Fire Breath Stream -->
  <g class="fire-breath" transform="translate(87, 33)">
    <polygon points="0,0 20,-8 35,-3 22,5 30,10 12,6" fill="#ffcc00" stroke="#ff3300" stroke-width="0.8"/>
    <circle cx="38" cy="0" r="3" fill="#ff2200"/>
  </g>
  <!-- Dragon Wing Front -->
  <path class="wing" style="animation-delay: 0.1s;" d="M55 42 C42 18 20 18 10 32 C22 36 34 35 45 48 Z" fill="#d62828" stroke="#500" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M38 68 C28 75 18 72 12 65 C16 70 24 71 34 65 Z" fill="#b31b1b" stroke="#300" stroke-width="1"/>
</svg>