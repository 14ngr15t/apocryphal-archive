<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 12" width="100%" height="12" preserveAspectRatio="none">
  <defs>
    <linearGradient id="rainbowFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color" values="#ff0000;#ff7f00;#ffff00;#00ff00;#0000ff;#4b0082;#8f00ff;#ff0000" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" stop-color="#ff7f00">
        <animate attributeName="stop-color" values="#ff7f00;#ffff00;#00ff00;#0000ff;#4b0082;#8f00ff;#ff0000;#ff7f00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%" stop-color="#ffff00">
        <animate attributeName="stop-color" values="#ffff00;#00ff00;#0000ff;#4b0082;#8f00ff;#ff0000;#ff7f00;#ffff00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#00ff00">
        <animate attributeName="stop-color" values="#00ff00;#0000ff;#4b0082;#8f00ff;#ff0000;#ff7f00;#ffff00;#00ff00" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#0000ff">
        <animate attributeName="stop-color" values="#0000ff;#4b0082;#8f00ff;#ff0000;#ff7f00;#ffff00;#00ff00;#0000ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8f00ff">
        <animate attributeName="stop-color" values="#8f00ff;#ff0000;#ff7f00;#ffff00;#00ff00;#0000ff;#4b0082;#8f00ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <!-- 3D Beveled bar -->
  <rect x="0" y="0" width="600" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="0" y="2" width="600" height="8" fill="url(#rainbowFlow)"/>
  <rect x="0" y="10" width="600" height="2" fill="#000000" opacity="0.8"/>
</svg>